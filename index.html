<!doctype html>
<html lang="sv">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pedalen cykelverkstad i stockholm</title>
        <meta
            name="description"
            content="Pedalen lagar och server all sorters cyklar i stockholm."
        />
        <link
            rel="shortcut icon"
            href="images/favicon.ico"
            type="image/x-icon"
        />
    </head>
    <body>
        <!-- Hoppa över länk, det är det första som får fokus när man trycker på tab -->
        <a href="#innehall" class="skip-link">Hoppa till innehåll</a>
        <header class="header">
            <div class="container header_inner">
                <a href="index.html" class="logo">Pedalen</a>
                <nav aria-label="Huvudmeny">
                    <ul class="nav">
                        <li><a href="#tjanster">Tjänster</a></li>
                        <li><a href="#priser">Priser</a></li>
                        <li><a href="#oppetider">Öppetider</a></li>
                        <li><a href="#kontakt">Kontakt</a></li>
                    </ul>
                </nav>
            </div>
        </header>
        <!-- Låter hoppa över gå direkt till main genom länken "innehall" -->
        <main id="innehall">
            <section class="hero on-dark">
                <div class="container hero__inner">
                    <p class="eyebrow">cykelverkstad i Stockholm</p>
                    <h1>Servad och redo för nästa åktur</h1>
                    <p class="lead">
                        Landsväg, stad eller singletrack. Vi lagar, servar och
                        trimmar alla sorters cyklar. Lämna in på morgonen, hämta
                        på eftermiddagen.
                    </p>
                    <p class="actions">
                        <a class="btn btn--primary" href="#kontakt"
                            >Boka service</a
                        >
                        <a class="btn btn--ghost" href="#kontakt"
                            >Boka service</a
                        >
                    </p>
                </div>
                <!-- figure och figcaption, en bild med bildtext som hör ihop -->
                <figure class="hero_media">
                    <img
                        src="images/hero.jpg"
                        alt="Mountainbikecyklist i luften mellan höga granar, med solen bakom trädtopparna"
                        width="960"
                        height="1440"
                    />
                    <figcaption class="badge">
                        Grundservice klar samma dag
                    </figcaption>
                </figure>
            </section>
        </main>
    </body>
</html>
